{% extends "base.html" %}
{% block title %}Novo registro{% endblock %}
{% block nav_forn %}active{% endblock %}
{% block page_title %}Fornecedores · {{ fornecedor.nome }} · Novo registro{% endblock %}

{% block content %}
<div class="card form-card">
    <form method="post">
        {% csrf_token %}
        {% include "_form_fields.html" %}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{% url 'fornecedores:editar' fornecedor.pk %}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
