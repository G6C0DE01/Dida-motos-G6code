{% if page_obj.paginator.num_pages > 1 %}
<div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-top:16px;">
    {% if page_obj.has_previous %}
        <a class="btn btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}">&larr; Anterior</a>
    {% endif %}
    <span class="link-muted" style="font-size:13px;">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a class="btn btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.next_page_number }}">Próxima &rarr;</a>
    {% endif %}
</div>
{% endif %}
