{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - Dida Motos</title>
    <script>
        (function () {
            try {
                if (localStorage.getItem("dida-motos-theme") === "light") {
                    document.documentElement.setAttribute("data-theme", "light");
                }
            } catch (e) { /* localStorage indisponível: mantém o tema padrão */ }
        })();
    </script>
    <style>
        :root {
            --bg: #0f1420;
            --panel: #161d2e;
            --panel-2: #1c2438;
            --border: #262f45;
            --text: #e6e9f0;
            --text-dim: #8b93a7;
            --orange: #e8912d;
            --red: #e05a5a;
        }
        :root[data-theme="light"] {
            --bg: #f3f4f8;
            --panel: #ffffff;
            --panel-2: #eef1f6;
            --border: #dde2ec;
            --text: #1a2030;
            --text-dim: #667085;
            --orange: #c9711a;
            --red: #d5453f;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 22px;
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg); color: var(--text);
        }
        h1 { font-size: 16px; margin: 0 0 18px; font-weight: 600; }
        .form-row { margin-bottom: 16px; }
        .form-row label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
        input[type=text], input[type=number], select, textarea {
            width: 100%; padding: 9px 12px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg); color: var(--text);
            font-size: 14px; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--orange); }
        .helptext { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
        .errorlist { list-style: none; padding: 0; margin: 4px 0 0; color: var(--red); font-size: 13px; }
        .form-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--panel-2); color: var(--text); font-size: 14px;
            cursor: pointer; text-decoration: none;
        }
        .btn-primary { background: var(--orange); border-color: var(--orange); color: #1a1a1a; font-weight: 600; }
    </style>
</head>
<body>
    <h1>{{ titulo }}</h1>
    {% if form.non_field_errors %}
        <ul class="errorlist">{% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}</ul>
    {% endif %}
    <form method="post" action="?{{ request.GET.urlencode }}">
        {% csrf_token %}
        {% include "_form_fields.html" %}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn" onclick="window.close()">Cancelar</button>
        </div>
    </form>
</body>
</html>
